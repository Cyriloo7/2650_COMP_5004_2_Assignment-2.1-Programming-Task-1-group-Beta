name: Tests

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:        # lets you run it manually

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run pytest
        run: python -m pytest -v --tb=long

      # optional: also run your script
      # - name: Run script
      #   run: python sort_search.py