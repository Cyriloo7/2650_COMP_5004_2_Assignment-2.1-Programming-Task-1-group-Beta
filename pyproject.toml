[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "numcompute"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "numpy"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "matplotlib"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["numcompute", "numcompute.*", "numcompute_stream", "numcompute_stream.*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["."]